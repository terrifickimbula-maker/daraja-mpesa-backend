<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blessed Hotek - M-Pesa Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        h2 { color: #2C3E50; text-align: center; margin-bottom: 20px; }
        label { font-weight: bold; font-size: 14px; color: #333; display: block; margin-top: 10px; }
        input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background: #27AE60; color: white; border: none; width: 100%; padding: 12px; margin-top: 20px; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        #responseMsg { margin-top: 15px; font-size: 13px; text-align: center; color: #555; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Blessed Hotek Checkout</h2>
        
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" value="2547" placeholder="e.g. 254712345678">

        <label for="amount">Amount (KES)</label>
        <input type="number" id="amount" value="10">

        <label for="room">Account / Room Ref</label>
        <input type="text" id="room" value="Room 101">

        <button onclick="triggerSTKPush()">Pay with M-Pesa</button>

        <div id="responseMsg"></div>
    </div>

    <script>
        async function triggerSTKPush() {
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const room = document.getElementById('room').value;
            const msgBox = document.getElementById('responseMsg');

            msgBox.innerHTML = "Processing payment prompt...";

            try {
                // Replace with your live Render backend URL
                const response = await fetch('https://daraja-mpesa-backend.onrender.com/api/v1/mpesa/stkpush', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        phone: phone,
                        amount: Number(amount),
                        account_reference: room
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    msgBox.innerHTML = `<span style="color: green;"><b>Success!</b> Check phone for M-Pesa prompt.</span>`;
                } else {
                    msgBox.innerHTML = `<span style="color: red;"><b>Error:</b> ${data.error || 'Failed to trigger prompt'}</span>`;
                }
            } catch (err) {
                msgBox.innerHTML = `<span style="color: red;"><b>Network Error:</b> Could not reach backend.</span>`;
            }
        }
    </script>

</body>
</html>
